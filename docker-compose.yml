services:
  api:
    build: .
    env_file: .env
    environment:
      # Inside the container, localhost is the container itself, not your PC.
      VLLM_BASE_URL: http://host.docker.internal:11434/v1
      FALLBACK_VLLM_BASE_URL: http://host.docker.internal:11434/v1
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "8000:8000"
    volumes:
      - ./data:/app/data

  ui:
    build: ./ui
    environment:
      BACKEND_URL: http://api:8000
    ports:
      - "8501:8501"
    depends_on:
      - api
